name: Partner

on:
  push:
    paths:
      - "apps/partner/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/partner.yml"
  pull_request:
    paths:
      - "apps/partner/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/partner.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include-workspace-root --prefer-offline --no-audit --no-fund
      - run: npm run lint:partner
      - run: npm run build:partner
