name: Customer

on:
  push:
    paths:
      - "apps/customer/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/customer.yml"
  pull_request:
    paths:
      - "apps/customer/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/customer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include-workspace-root
      - run: npm run lint:customer
      - run: npm run build:customer
