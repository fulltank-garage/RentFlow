name: Customer

on:
  push:
    paths:
      - "apps/customer/**"
      - ".github/workflows/customer.yml"
  pull_request:
    paths:
      - "apps/customer/**"
      - ".github/workflows/customer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
