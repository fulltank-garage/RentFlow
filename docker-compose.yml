services:
  customer:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm ci --include-workspace-root && npm --workspace rentflow-web-app run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_RENTFLOW_ROOT_DOMAIN: rentflowcar.xyz
    ports:
      - "3000:3000"
    volumes:
      - ./:/repo
      - customer_root_node_modules:/repo/node_modules
    depends_on:
      - api

  admin:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm ci --include-workspace-root && npm --workspace rentflow-admin-dashboard run dev -- --hostname 0.0.0.0 --port 3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3001:3001"
    volumes:
      - ./:/repo
      - admin_root_node_modules:/repo/node_modules
    depends_on:
      - api

  partner:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm ci --include-workspace-root && npm --workspace rentflow-partner-dashboard run dev -- --hostname 0.0.0.0 --port 3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STOREFRONT_PORT: "3000"
      NEXT_PUBLIC_RENTFLOW_ROOT_DOMAIN: rentflowcar.xyz
    ports:
      - "3002:3002"
    volumes:
      - ./:/repo
      - partner_root_node_modules:/repo/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-rentflow}
      DB_PASSWORD: ${DB_PASSWORD:-rentflow}
      DB_NAME: ${DB_NAME:-rentflow}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      RENTFLOW_AI_OLLAMA_URL: http://ollama:11434
      RENTFLOW_AI_MODEL: ${RENTFLOW_AI_MODEL:-qwen2.5:1.5b}
      RENTFLOW_SUPER_ADMIN_USERNAME: ${RENTFLOW_SUPER_ADMIN_USERNAME:-admin}
      RENTFLOW_SUPER_ADMIN_EMAIL: ${RENTFLOW_SUPER_ADMIN_EMAIL:-admin@rentflow.local}
      RENTFLOW_SUPER_ADMIN_PASSWORD: ${RENTFLOW_SUPER_ADMIN_PASSWORD:-}
      RENTFLOW_SUPER_ADMIN_FIRST_NAME: ${RENTFLOW_SUPER_ADMIN_FIRST_NAME:-Platform}
      RENTFLOW_SUPER_ADMIN_LAST_NAME: ${RENTFLOW_SUPER_ADMIN_LAST_NAME:-Admin}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      RENTFLOW_AI_MODEL: ${RENTFLOW_AI_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${RENTFLOW_AI_MODEL}\""]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rentflow}
      POSTGRES_USER: ${DB_USER:-rentflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rentflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow -d rentflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  customer_root_node_modules:
  admin_root_node_modules:
  partner_root_node_modules:
  postgres_data:
  redis_data:
  ollama_data:
